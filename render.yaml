# One-click deploy to Render (https://render.com).
# Serves the frontend AND the auth/admin API from a single free Node service.
#
# Steps: Render → New → Blueprint → connect this repo → pick the branch → Apply.
# JWT_SECRET is generated automatically and APP_URL resolves from Render's own
# URL, so a plain deploy already works. Add the SMTP_* values to send real
# verification emails (until then the link is printed in the Logs tab).
services:
  - type: web
    name: mindmap
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true            # Render generates a strong secret
      # SQLite lives on the instance disk. On the FREE plan it resets on
      # restart/redeploy; add a paid Render Disk (or Postgres) to persist.
      - key: DATABASE_FILE
        value: /tmp/mindmap.db
      # The only administrator account.
      - key: ADMIN_EMAIL
        value: harshavardhangowda525@gmail.com
      # Optional — overrides the auto-detected public URL used in emails.
      - key: APP_URL
        sync: false
      # Email service (verification + reset). Leave blank to log links to the
      # Logs tab; fill in for real emails (e.g. a Gmail App Password).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
